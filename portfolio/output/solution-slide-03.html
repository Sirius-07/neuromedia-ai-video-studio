<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solution Slide 03</title>
  <style>
    :root {
      --ink: #0e1828;
      --muted: #536274;
      --line: #d7e3ec;
      --cyan: #0aa6c8;
      --cyan-dark: #087a94;
      --paper: #f7fbfd;
      --warm: #f4f7f9;
      --orange: #d9842f;
      --red: #c7473d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 2048px;
      height: 1152px;
      overflow: hidden;
      background: #c8c8c8;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
      color: var(--ink);
    }

    .slide {
      position: relative;
      width: 2048px;
      height: 1152px;
      margin: 0;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,.82), rgba(255,255,255,.55)),
        radial-gradient(circle at 14% 20%, rgba(10,166,200,.10), transparent 28%),
        radial-gradient(circle at 86% 78%, rgba(217,132,47,.08), transparent 26%),
        #eef6fa;
      border: 14px solid #8d8f91;
    }

    .topbar {
      position: absolute;
      left: 82px;
      right: 82px;
      top: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 54px;
      color: #4b596b;
      font-weight: 700;
      letter-spacing: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 28px;
    }

    .mark {
      width: 44px;
      height: 44px;
      border: 3px solid var(--cyan);
      border-radius: 8px;
      position: relative;
    }

    .mark::before,
    .mark::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      background: var(--cyan);
      transform: translate(-50%, -50%);
    }

    .mark::before {
      width: 22px;
      height: 3px;
    }

    .mark::after {
      width: 3px;
      height: 22px;
    }

    .brand strong {
      color: var(--cyan);
      font-size: 30px;
    }

    .rule {
      flex: 1;
      height: 2px;
      margin-left: 28px;
      background: linear-gradient(90deg, rgba(10,166,200,.55), rgba(10,166,200,.08));
    }

    .page {
      color: var(--cyan);
      font-size: 68px;
      line-height: 1;
      font-weight: 800;
    }

    .page::after {
      content: "";
      display: block;
      width: 72px;
      height: 7px;
      margin-top: 16px;
      background: var(--cyan);
      border-radius: 999px;
    }

    .title {
      position: absolute;
      left: 86px;
      top: 156px;
      width: 1130px;
      z-index: 5;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--cyan-dark);
      font-size: 27px;
      font-weight: 800;
      margin-bottom: 26px;
    }

    .eyebrow::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 30px;
      background: var(--cyan);
      border-radius: 99px;
    }

    h1 {
      margin: 0;
      font-size: 62px;
      line-height: 1.12;
      letter-spacing: 0;
      font-weight: 900;
      max-width: 1130px;
    }

    .subtitle {
      margin-top: 20px;
      max-width: 990px;
      color: var(--muted);
      font-size: 28px;
      line-height: 1.48;
      font-weight: 500;
    }

    .canvas {
      position: absolute;
      left: 78px;
      right: 78px;
      top: 328px;
      bottom: 78px;
    }

    .hero-shot {
      position: absolute;
      left: 560px;
      top: 52px;
      width: 1242px;
      height: 680px;
      border-radius: 10px;
      background: white;
      border: 1px solid rgba(14,24,40,.12);
      box-shadow: 0 26px 64px rgba(20, 41, 62, .20);
      overflow: hidden;
    }

    .hero-shot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top left;
      display: block;
    }

    .hero-shot::before {
      content: "";
      position: absolute;
      inset: 0;
      border: 4px solid rgba(10,166,200,.22);
      pointer-events: none;
    }

    .mini {
      position: absolute;
      background: white;
      border: 1px solid rgba(14,24,40,.12);
      box-shadow: 0 18px 42px rgba(20, 41, 62, .16);
      overflow: hidden;
    }

    .mini img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .input-shot {
      left: 34px;
      top: 112px;
      width: 560px;
      height: 315px;
      border-radius: 8px;
      transform: rotate(-2deg);
    }

    .story-shot {
      left: 232px;
      top: 468px;
      width: 610px;
      height: 342px;
      border-radius: 8px;
      transform: rotate(1.5deg);
    }

    .tag {
      position: absolute;
      z-index: 8;
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 58px;
      padding: 13px 18px;
      border-radius: 10px;
      background: rgba(255,255,255,.94);
      border: 1px solid rgba(14,24,40,.12);
      box-shadow: 0 12px 32px rgba(20,41,62,.14);
      font-size: 22px;
      line-height: 1.25;
      font-weight: 750;
      white-space: nowrap;
    }

    .tag span {
      color: var(--muted);
      font-size: 18px;
      font-weight: 500;
    }

    .num {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--ink);
      color: white;
      font-size: 17px;
      font-weight: 900;
      flex: none;
    }

    .tag-1 {
      left: 80px;
      top: 68px;
    }

    .tag-2 {
      left: 618px;
      top: 8px;
    }

    .tag-3 {
      right: 78px;
      bottom: 48px;
    }

    .callout {
      position: absolute;
      z-index: 9;
      background: #fff8ee;
      border: 1px solid rgba(217,132,47,.38);
      color: #8b4d18;
      font-size: 23px;
      font-weight: 800;
      padding: 14px 18px;
      border-radius: 8px;
      box-shadow: 0 10px 24px rgba(141,77,24,.10);
      transform: rotate(-1deg);
    }

    .callout::before {
      content: "";
      position: absolute;
      left: 18px;
      top: -16px;
      width: 66px;
      height: 24px;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(14,24,40,.08);
      transform: rotate(-6deg);
    }

    .callout-video {
      left: 1052px;
      top: 86px;
    }

    .callout-agent {
      right: 106px;
      top: 192px;
      color: #8c241d;
      background: #fff4f2;
      border-color: rgba(199,71,61,.32);
      transform: rotate(1.2deg);
    }

    .flow-line {
      position: absolute;
      z-index: 2;
      pointer-events: none;
    }

    .flow-a {
      left: 416px;
      top: 398px;
      width: 322px;
      height: 104px;
      border-top: 3px solid rgba(10,166,200,.48);
      border-right: 3px solid rgba(10,166,200,.48);
      border-radius: 0 36px 0 0;
      transform: rotate(-2deg);
    }

    .flow-a::after,
    .flow-b::after {
      content: "";
      position: absolute;
      right: -9px;
      bottom: -2px;
      width: 16px;
      height: 16px;
      border-right: 3px solid rgba(10,166,200,.62);
      border-bottom: 3px solid rgba(10,166,200,.62);
      transform: rotate(-45deg);
    }

    .flow-b {
      left: 830px;
      top: 648px;
      width: 322px;
      height: 100px;
      border-top: 3px solid rgba(10,166,200,.42);
      border-right: 3px solid rgba(10,166,200,.42);
      border-radius: 0 34px 0 0;
      transform: rotate(-10deg);
    }

    .thesis {
      position: absolute;
      left: 90px;
      bottom: 78px;
      width: 1110px;
      padding: 24px 30px;
      display: flex;
      align-items: center;
      gap: 18px;
      border-top: 3px solid rgba(10,166,200,.68);
      background: rgba(255,255,255,.55);
      backdrop-filter: blur(2px);
      font-size: 28px;
      line-height: 1.36;
      font-weight: 700;
      color: var(--ink);
    }

    .thesis svg {
      width: 54px;
      height: 54px;
      flex: none;
      color: var(--cyan);
    }

    .thesis em {
      color: var(--cyan-dark);
      font-style: normal;
    }

    .corner-note {
      position: absolute;
      right: 98px;
      top: 250px;
      z-index: 6;
      width: 420px;
      color: var(--ink);
      font-size: 29px;
      line-height: 1.35;
      font-weight: 850;
      text-align: left;
    }

    .corner-note small {
      display: block;
      margin-top: 10px;
      color: var(--muted);
      font-size: 22px;
      line-height: 1.42;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <main class="slide">
    <header class="topbar">
      <div class="brand">
        <div class="mark" aria-hidden="true"></div>
        <strong>NEUROMEDIA</strong>
        <span>|</span>
        <span>AI 产品交互设计案例</span>
        <div class="rule"></div>
      </div>
      <div class="page">03</div>
    </header>

    <section class="title">
      <div class="eyebrow">解决方案</div>
      <h1>先生成一版可对齐的视频初稿</h1>
      <p class="subtitle">把报道稿、素材和记者的画面意图转成可播放样片，让沟通从“口头想象”变成“围绕具体画面修改”。</p>
    </section>

    <aside class="corner-note">
      系统补上的，是报道意图到视频制作之间的翻译层
      <small>记者先看到第一版，再判断重点、气质和画面是否对。</small>
    </aside>

    <section class="canvas" aria-label="Solution evidence layout">
      <div class="mini input-shot">
        <img src="../..//frontend/public/portfolio-preview/assets/start-filled-live.png" alt="输入报道稿和素材的任务界面" />
      </div>

      <div class="mini story-shot">
        <img src="../..//frontend/public/portfolio-preview/assets/storyboard.png" alt="分镜生成界面" />
      </div>

      <div class="hero-shot">
        <img src="../..//frontend/public/portfolio-preview/assets/handoff-desktop.png" alt="视频初稿播放、批注和交接界面" />
      </div>

      <div class="flow-line flow-a"></div>
      <div class="flow-line flow-b"></div>

      <div class="tag tag-1">
        <div class="num">1</div>
        <div>输入报道意图<br><span>报道稿 / 素材 / 画面要求</span></div>
      </div>

      <div class="tag tag-2">
        <div class="num">2</div>
        <div>生成第一版<br><span>分镜结构 + 可播放样片</span></div>
      </div>

      <div class="tag tag-3">
        <div class="num">3</div>
        <div>围绕画面协作<br><span>批注修改 / 版本确认 / 交接制作</span></div>
      </div>

      <div class="callout callout-video">视频初稿先出来</div>
      <div class="callout callout-agent">意见直接落到镜头上</div>
    </section>

    <footer class="thesis">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <circle cx="24" cy="24" r="18" stroke="currentColor" stroke-width="4"/>
        <circle cx="24" cy="24" r="7" stroke="currentColor" stroke-width="4"/>
        <path d="M36 12l6-6M36 12h8M36 12V4" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div><em>从“描述想要什么”，变成“先看到一版，再一起改到对”。</em></div>
    </footer>
  </main>
</body>
</html>
